<svg width="1120" height="540" viewBox="0 0 1120 540" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="24" width="160" height="36" rx="8" fill="#111827"/><text x="110" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">benchmark 调用方</text><line x1="110" y1="60" x2="110" y2="520" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="310" y="24" width="160" height="36" rx="8" fill="#2563eb"/><text x="390" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">线程 1~50</text><line x1="390" y1="60" x2="390" y2="520" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="620" y="24" width="160" height="36" rx="8" fill="#2563eb"/><text x="700" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">AgentENV 主进程</text><line x1="700" y1="60" x2="700" y2="520" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="890" y="24" width="160" height="36" rx="8" fill="#dc2626"/><text x="970" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">内部组件</text><line x1="970" y1="60" x2="970" y2="520" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="110" y1="100" x2="382" y2="100" stroke="#374151" stroke-width="1.6"/><polygon points="390,100 382,95 382,105" fill="#374151"/><text x="250.0" y="92" text-anchor="middle" font-size="12" fill="#374151">50 个线程同时起跑</text><rect x="40" y="130" width="1040" height="300" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5"/><rect x="40" y="130" width="120" height="26" rx="6" fill="#e5e7eb"/><text x="100" y="148" text-anchor="middle" font-size="12" fill="#374151">循环采样</text><line x1="390" y1="190" x2="692" y2="190" stroke="#374151" stroke-width="1.6"/><polygon points="700,190 692,185 692,195" fill="#374151"/><text x="545.0" y="182" text-anchor="middle" font-size="12" fill="#374151">恢复一个（计时开始）</text><line x1="700" y1="235" x2="962" y2="235" stroke="#374151" stroke-width="1.6"/><polygon points="970,235 962,230 962,240" fill="#374151"/><text x="835.0" y="227" text-anchor="middle" font-size="12" fill="#374151">复用热进程、热设备，装载快照</text><line x1="970" y1="275" x2="708" y2="275" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/><polygon points="700,275 708,270 708,280" fill="#6b7280"/><text x="835.0" y="267" text-anchor="middle" font-size="12" fill="#6b7280">就绪</text><line x1="700" y1="320" x2="398" y2="320" stroke="#374151" stroke-width="1.6"/><polygon points="390,320 398,315 398,325" fill="#374151"/><text x="545.0" y="312" text-anchor="middle" font-size="12" fill="#374151">返回沙箱（计时结束）</text><rect x="398" y="351" width="168" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="410" y="370" font-size="12" fill="#92400e">停沙箱、等清理（不计时）</text><rect x="398" y="396" width="84" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="410" y="415" font-size="12" fill="#92400e">进入下一轮</text><rect x="40" y="460" width="1040" height="58" rx="10" fill="#eff6ff" stroke="#2563eb"/><text x="60" y="484" font-size="13" font-weight="600" fill="#1e3a8a">成绩：每个线程把自己所有计时相加，全部相加后 ÷ 50</text><text x="60" y="504" font-size="13" fill="#1e40af">即并发下平均一次恢复的耗时，不是整批墙钟时间</text><line x1="60" y1="182" x2="60" y2="328" stroke="#ea580c" stroke-width="2.5"/><line x1="60" y1="182" x2="72" y2="182" stroke="#ea580c" stroke-width="2.5"/><line x1="60" y1="328" x2="72" y2="328" stroke="#ea580c" stroke-width="2.5"/><text x="46" y="255.0" transform="rotate(-90 46 255.0)" text-anchor="middle" font-size="12" fill="#c2410c">计时</text></svg>